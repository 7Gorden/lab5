<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Резюме - Чепеляк Марк</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <h1>Чепеляк Марк Васильович</h1>
        <p><strong>Посада:</strong> Junior Cybersecurity Specialist</p>
    </header>

    <main>
        <button id="open-modal">Написати мені</button>
        <button id="theme-toggle">Змінити тему</button>
    </main>

    <div id="feedback-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:20px; border:2px solid #333; z-index:1000;">
        <h3>Зворотний зв'язок</h3>
        <form id="contact-form">
            <input type="text" name="name" placeholder="Ім'я" required><br><br>
            <input type="email" name="email" placeholder="Email" required><br><br>
            <textarea name="message" placeholder="Повідомлення" required></textarea><br><br>
            <button type="submit">Відправити</button>
            <button type="button" id="close-modal">Закрити</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
